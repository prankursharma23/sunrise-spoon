<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sunrise Spoon - Onboarding Step 2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f49d25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221a10",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col max-w-md mx-auto bg-white dark:bg-background-dark shadow-xl overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-white dark:bg-background-dark z-10">
<button class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center flex-1 pr-12">
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight">Sunrise Spoon</h2>
</div>
</div>
<!-- Progress Section -->
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-center">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold uppercase tracking-wider">Step 2 of 4</p>
<p class="text-primary text-sm font-bold">50% Complete</p>
</div>
<div class="rounded-full bg-slate-200 dark:bg-slate-700 h-2 w-full overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 50%;"></div>
</div>
</div>
<!-- Form Content -->
<div class="flex flex-col px-4 pb-24">
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-extrabold leading-tight pt-5 pb-6">Health Background</h3>
<!-- Question 1: Ongoing Medication -->
<div class="mb-6">
<label class="flex flex-col w-full">
<p class="text-slate-900 dark:text-slate-100 text-base font-bold leading-normal pb-2">Ongoing medication</p>
<textarea class="form-textarea flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 min-h-32 placeholder:text-slate-400 p-4 text-base font-normal transition-all" placeholder="Describe any current or previous medications..."></textarea>
</label>
</div>
<!-- Question 2: Last Full Body Checkup -->
<div class="mb-6">
<label class="flex flex-col w-full">
<p class="text-slate-900 dark:text-slate-100 text-base font-bold leading-normal pb-2">Last full body checkup</p>
<div class="relative flex items-center">
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 h-14 placeholder:text-slate-400 px-4 text-base font-normal pr-12 transition-all" placeholder="MM/DD/YYYY" type="text"/>
<span class="material-symbols-outlined absolute right-4 text-slate-400 pointer-events-none">calendar_month</span>
</div>
</label>
</div>
<!-- Question 3: Reports Upload -->
<div class="mb-6">
<p class="text-slate-900 dark:text-slate-100 text-base font-bold leading-normal pb-2">Reports of full body checkup</p>
<div class="border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl p-8 flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer group">
<div class="bg-primary/10 p-3 rounded-full mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-3xl">cloud_upload</span>
</div>
<p class="text-slate-900 dark:text-slate-100 font-semibold text-sm">Tap to upload reports</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-1">PDF, JPG or PNG (Max 10MB)</p>
</div>
</div>
<!-- Question 4: Goal for Diet Chart -->
<div class="mb-6">
<p class="text-slate-900 dark:text-slate-100 text-base font-bold leading-normal pb-3">Goal for diet chart</p>
<div class="flex flex-col gap-3">
<label class="flex items-center p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 cursor-pointer hover:border-primary/50 transition-all">
<input class="w-5 h-5 text-primary border-slate-300 focus:ring-primary" name="diet_goal" type="radio"/>
<span class="ml-3 text-slate-900 dark:text-slate-100 font-medium">Weight Loss</span>
</label>
<label class="flex items-center p-4 rounded-xl border-2 border-primary bg-primary/5 cursor-pointer transition-all">
<input checked="" class="w-5 h-5 text-primary border-slate-300 focus:ring-primary" name="diet_goal" type="radio"/>
<span class="ml-3 text-slate-900 dark:text-slate-100 font-bold">Weight Gain</span>
</label>
<label class="flex items-center p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 cursor-pointer hover:border-primary/50 transition-all">
<input class="w-5 h-5 text-primary border-slate-300 focus:ring-primary" name="diet_goal" type="radio"/>
<span class="ml-3 text-slate-900 dark:text-slate-100 font-medium">Manage Specific Disease</span>
</label>
</div>
</div>
</div>
<!-- Sticky Footer Navigation -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 p-4 flex gap-3 z-20">
<button class="flex-1 h-14 rounded-xl border-2 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                Back
            </button>
<button class="flex-[2] h-14 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/25 hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
                Next Step
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</body></html>
