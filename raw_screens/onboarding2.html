<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#f49d25",
                "background-light": "#f8f7f5",
                "background-dark": "#221a10",
              },
              fontFamily: {
                "display": ["Manrope"]
              },
              borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
          },
        }
    </script>
<title>Sunrise Spoon - Onboarding</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full max-w-[480px] mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header Section -->
<header class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md z-10">
<button class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Onboarding</h2>
</header>
<!-- Progress Indicator -->
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-end">
<div class="flex flex-col">
<span class="text-primary text-xs font-bold uppercase tracking-wider">Step 4 of 4</span>
<p class="text-slate-900 dark:text-slate-100 text-base font-bold leading-normal">100% Complete</p>
</div>
<div class="flex items-center gap-1">
<img alt="Sunrise Spoon Logo" class="h-8 w-8 object-contain" data-alt="Sunrise Spoon orange spoon sun logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAoFMahNc7ACId8E-SkVi7p8zdpWn3kdMn_6PXS21iQ-jEyFDRxwrE7Koix-JfDjnMctoOzgVQeoS3VaDnofZ8HMtDOTNwOKEEnTW-pNxtAlM1iH6lHV1XbT9jOW20JiJ2MkKmPtte4s7jcIoePPv2Nu0Ndbi0eBP60ZQwfYHZoilxQZfAbou8dIDCWSLkM2fEDdbReH4iuQ5csZiUXNlAA5fER8j7oLBY88Gz7oVVEm34qOvg0ZWjxrfZ-TuymVbF9EcwQjwRDM5Rs"/>
</div>
</div>
<div class="rounded-full bg-primary/20 h-2 w-full overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 100%;"></div>
</div>
</div>
<!-- Hero Text -->
<div class="px-4 pt-6 pb-2">
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-extrabold leading-tight">Body Metrics</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-medium leading-relaxed mt-2">
                Final step! Please provide your body measurements to help us calculate your nutritional needs accurately.
            </p>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-6 p-4 pb-32">
<!-- Height Field with Unit Toggle -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-slate-900 dark:text-slate-100 text-sm font-bold">Height</label>
<div class="flex bg-primary/10 p-1 rounded-full">
<button class="px-3 py-1 text-xs font-bold rounded-full bg-primary text-white" type="button">cm</button>
<button class="px-3 py-1 text-xs font-bold rounded-full text-primary" type="button">ft</button>
</div>
</div>
<div class="relative">
<input class="w-full h-14 bg-white dark:bg-slate-800 border-2 border-primary/20 focus:border-primary focus:ring-0 rounded-xl px-4 text-lg font-semibold text-slate-900 dark:text-slate-100 placeholder:text-slate-400" placeholder="175" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">cm</span>
</div>
</div>
<!-- Weight Grid -->
<div class="grid grid-cols-2 gap-4">
<!-- Current Weight -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-slate-900 dark:text-slate-100 text-sm font-bold">Weight</label>
<span class="text-[10px] font-bold text-primary uppercase">kg</span>
</div>
<input class="w-full h-14 bg-white dark:bg-slate-800 border-2 border-primary/20 focus:border-primary focus:ring-0 rounded-xl px-4 text-lg font-semibold text-slate-900 dark:text-slate-100 placeholder:text-slate-400" placeholder="70" type="number"/>
</div>
<!-- Target Weight -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-slate-900 dark:text-slate-100 text-sm font-bold">Target <span class="text-slate-400 font-normal">(Opt)</span></label>
</div>
<input class="w-full h-14 bg-white dark:bg-slate-800 border-2 border-primary/20 focus:border-primary focus:ring-0 rounded-xl px-4 text-lg font-semibold text-slate-900 dark:text-slate-100 placeholder:text-slate-400" placeholder="65" type="number"/>
</div>
</div>
<!-- Date of Birth -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-bold">Date of Birth</label>
<div class="relative">
<input class="w-full h-14 bg-white dark:bg-slate-800 border-2 border-primary/20 focus:border-primary focus:ring-0 rounded-xl px-4 text-lg font-semibold text-slate-900 dark:text-slate-100 appearance-none" type="date"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-primary pointer-events-none">
<span class="material-symbols-outlined">calendar_today</span>
</span>
</div>
</div>
<!-- Gender Selection -->
<div class="flex flex-col gap-3">
<label class="text-slate-900 dark:text-slate-100 text-sm font-bold">Biological Gender</label>
<div class="grid grid-cols-3 gap-3">
<label class="cursor-pointer group">
<input checked="" class="hidden peer" name="gender" type="radio"/>
<div class="flex flex-col items-center justify-center gap-2 h-24 rounded-xl border-2 border-primary/10 bg-white dark:bg-slate-800 peer-checked:border-primary peer-checked:bg-primary/5 transition-all">
<span class="material-symbols-outlined text-slate-400 peer-checked:text-primary">male</span>
<span class="text-sm font-bold text-slate-600 dark:text-slate-300 peer-checked:text-primary">Male</span>
</div>
</label>
<label class="cursor-pointer group">
<input class="hidden peer" name="gender" type="radio"/>
<div class="flex flex-col items-center justify-center gap-2 h-24 rounded-xl border-2 border-primary/10 bg-white dark:bg-slate-800 peer-checked:border-primary peer-checked:bg-primary/5 transition-all">
<span class="material-symbols-outlined text-slate-400 peer-checked:text-primary">female</span>
<span class="text-sm font-bold text-slate-600 dark:text-slate-300 peer-checked:text-primary">Female</span>
</div>
</label>
<label class="cursor-pointer group">
<input class="hidden peer" name="gender" type="radio"/>
<div class="flex flex-col items-center justify-center gap-2 h-24 rounded-xl border-2 border-primary/10 bg-white dark:bg-slate-800 peer-checked:border-primary peer-checked:bg-primary/5 transition-all">
<span class="material-symbols-outlined text-slate-400 peer-checked:text-primary">transgender</span>
<span class="text-sm font-bold text-slate-600 dark:text-slate-300 peer-checked:text-primary">Other</span>
</div>
</label>
</div>
</div>
</form>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto p-4 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-lg border-t border-primary/10">
<button class="w-full h-16 bg-primary hover:bg-primary/90 text-white text-lg font-extrabold rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                Complete Setup
                <span class="material-symbols-outlined">check_circle</span>
</button>
</div>
</div>
</body></html>
