<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sunrise Spoon - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f49d25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221a10",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- Top Navigation Area -->
<div class="flex items-center bg-transparent p-4 justify-between">
<div class="text-primary flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1">
                    light_mode
                </span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-extrabold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
                Sunrise Spoon
            </h2>
</div>
<!-- Hero Image Section -->
<div class="w-full @container px-4">
<div class="@[480px]:py-3">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden bg-primary/10 rounded-xl min-h-[400px] shadow-lg shadow-primary/5" data-alt="Fresh vibrant salad bowl with colorful vegetables" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA08BI0zTCjJo4jhWlhyJn1KJ9eqg9x3Qaga25xbp3y-jmBgrTibw5uE5PhfwSJqhALhX9ZOYgDMvNUbn5_9VeSenZX3_JgikK98TQLqr1UzteTDvyuOdVlCGbZ8BdQddqcLuyiGb1fnJY_YMVwB3Nmm-Xi5GKkRRgi1YkLMIGqmkvh-RqzrmDAGv1H4RhbF0fnDbpVTEpjzD5Oy9lKhNbdluHSbUN951gtg7zBwhveT2cGPSbRpF7DKd1YnbMy5b2CCmqqIphwvXgh");'>
</div>
</div>
</div>
<!-- Content Section -->
<div class="flex flex-col flex-1 px-6 pb-8 pt-8 text-center">
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-4xl font-extrabold leading-tight pb-4">
                Fuel Your Day with <span class="text-primary">Sunrise Spoon</span>
</h1>
<p class="text-slate-600 dark:text-slate-400 text-lg font-medium leading-relaxed px-2">
                Receive your personalized diet chart every morning to kickstart your healthy journey.
            </p>
<!-- Pagination Dots -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-10">
<div class="h-2.5 w-8 rounded-full bg-primary"></div>
<div class="h-2.5 w-2.5 rounded-full bg-primary/20"></div>
<div class="h-2.5 w-2.5 rounded-full bg-primary/20"></div>
</div>
<!-- Action Area -->
<div class="mt-auto w-full flex flex-col gap-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-5 rounded-full text-xl shadow-xl shadow-primary/20 transition-all flex items-center justify-center gap-2">
                    Get Started
                    <span class="material-symbols-outlined">
                        arrow_forward
                    </span>
</button>
<button class="w-full bg-transparent text-slate-500 dark:text-slate-400 font-semibold py-2 rounded-full text-base transition-all">
                    Sign In
                </button>
</div>
</div>
</div>
</body></html>
