<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sunrise Spoon - Onboarding Step 3</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f49d25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221a10",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex h-auto min-h-screen w-full max-w-md mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<button class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Onboarding</h2>
</div>
<!-- Progress Bar Section -->
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-center">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold uppercase tracking-wider">Step 3 of 4</p>
<p class="text-slate-900 dark:text-slate-100 text-sm font-normal leading-normal text-primary font-bold">75% Complete</p>
</div>
<div class="rounded-full bg-primary/20 h-2 w-full overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 75%;"></div>
</div>
</div>
<!-- Title Section -->
<div class="px-4 pt-5 pb-2">
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-bold leading-tight">Step 3 of 4: Food &amp; Lifestyle</h1>
<p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Help us customize your nutritional plan based on your habits.</p>
</div>
<!-- Food Preference Section -->
<div class="px-4 py-4">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] mb-4">Food Preference</h3>
<div class="grid grid-cols-2 gap-4">
<!-- Vegetarian Option -->
<label class="relative flex flex-col items-center gap-3 p-4 rounded-xl border-2 border-primary bg-primary/5 cursor-pointer">
<input checked="" class="absolute opacity-0" name="diet" type="radio" value="vegetarian"/>
<div class="bg-primary/20 p-3 rounded-full text-primary">
<span class="material-symbols-outlined text-3xl">eco</span>
</div>
<span class="font-bold text-slate-900 dark:text-slate-100">Vegetarian</span>
</label>
<!-- Non-Vegetarian Option -->
<label class="relative flex flex-col items-center gap-3 p-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer">
<input class="absolute opacity-0" name="diet" type="radio" value="non-vegetarian"/>
<div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-full text-slate-500">
<span class="material-symbols-outlined text-3xl">set_meal</span>
</div>
<span class="font-bold text-slate-900 dark:text-slate-100">Non-Veg</span>
</label>
</div>
</div>
<!-- Lifestyle Section -->
<div class="px-4 py-4 flex-1 pb-28">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] mb-4">Lifestyle Type</h3>
<div class="flex flex-col gap-3">
<!-- Option 1 -->
<label class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">fitness_center</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">Workout + Deskwork</span>
</div>
<input class="rounded text-primary focus:ring-primary h-5 w-5" type="checkbox"/>
</label>
<!-- Option 2 -->
<label class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">desktop_windows</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">Only Deskwork</span>
</div>
<input class="rounded text-primary focus:ring-primary h-5 w-5" type="checkbox"/>
</label>
<!-- Option 3 -->
<label class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">exercise</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">Only Workout</span>
</div>
<input class="rounded text-primary focus:ring-primary h-5 w-5" type="checkbox"/>
</label>
<!-- Option 4 -->
<label class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">directions_walk</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">Active Lifestyle (Walking)</span>
</div>
<input checked="" class="rounded text-primary focus:ring-primary h-5 w-5" type="checkbox"/>
</label>
</div>
</div>
<!-- Navigation Buttons -->
<!-- Bottom Nav Bar Component -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 p-4 flex gap-3 z-20">
<button class="flex-1 h-14 rounded-xl border-2 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                Back
            </button>
<button class="flex-[2] h-14 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/25 hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
                Next Step
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div></div>
</body></html>
