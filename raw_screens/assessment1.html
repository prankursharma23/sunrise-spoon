<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f49d25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221a10",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 md:p-8">
<div class="max-w-2xl w-full bg-white dark:bg-slate-900/40 shadow-xl shadow-primary/5 rounded-lg overflow-hidden border border-primary/10">
<div class="p-8 md:p-12">
<!-- Header Section -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary/10 rounded-full mb-4">
<span class="material-icons text-primary text-3xl">health_and_safety</span>
</div>
<h1 class="text-3xl font-bold text-slate-900 dark:text-slate-100">Sunrise Spoon</h1>
<p class="text-slate-500 dark:text-slate-400 mt-2">Personalized Health Assessment</p>
</div>
<!-- Progress Indicator -->
<div class="mb-12">
<div class="flex items-center justify-between mb-2">
<span class="text-sm font-semibold text-primary uppercase tracking-wider">Step 1 of 4: Medical History</span>
<span class="text-sm font-medium text-slate-400">25% Complete</span>
</div>
<div class="w-full bg-primary/10 h-2 rounded-full overflow-hidden">
<div class="bg-primary h-full w-1/4 rounded-full"></div>
</div>
</div>
<!-- Form Content -->
<form action="#" class="space-y-8">
<!-- Field 1: Prior Accidents -->
<div class="space-y-2">
<label class="flex items-center text-sm font-bold text-slate-700 dark:text-slate-200">
<span class="material-icons text-primary text-sm mr-2">emergency</span>
                        Prior Accidents
                    </label>
<textarea class="w-full bg-background-light dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded p-4 text-slate-800 dark:text-slate-100 transition-all resize-none" placeholder="Please describe any major accidents or injuries..." rows="3"></textarea>
</div>
<!-- Field 2: Prior Surgeries -->
<div class="space-y-2">
<label class="flex items-center text-sm font-bold text-slate-700 dark:text-slate-200">
<span class="material-icons text-primary text-sm mr-2">medical_services</span>
                        Prior Surgeries
                    </label>
<textarea class="w-full bg-background-light dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded p-4 text-slate-800 dark:text-slate-100 transition-all resize-none" placeholder="List any past surgical procedures and approximate dates..." rows="3"></textarea>
</div>
<!-- Field 3: Food Allergies -->
<div class="space-y-2">
<label class="flex items-center text-sm font-bold text-slate-700 dark:text-slate-200">
<span class="material-icons text-primary text-sm mr-2">no_meals</span>
                        Food Allergies
                    </label>
<textarea class="w-full bg-background-light dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded p-4 text-slate-800 dark:text-slate-100 transition-all resize-none" placeholder="Detail any known food allergies or intolerances..." rows="3"></textarea>
</div>
<!-- Field 4: Prior Diseases -->
<div class="space-y-2">
<label class="flex items-center text-sm font-bold text-slate-700 dark:text-slate-200">
<span class="material-icons text-primary text-sm mr-2">coronavirus</span>
                        Prior Diseases
                    </label>
<textarea class="w-full bg-background-light dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded p-4 text-slate-800 dark:text-slate-100 transition-all resize-none" placeholder="Mention any chronic illnesses or significant diseases..." rows="3"></textarea>
</div>
<!-- Footer Navigation -->
<div class="pt-6 flex items-center justify-between">
<button class="text-slate-400 font-bold hover:text-slate-600 dark:hover:text-slate-200 flex items-center transition-colors" type="button">
<span class="material-icons mr-1">chevron_left</span>
                        Back
                    </button>
<button class="bg-primary text-white font-bold py-4 px-10 rounded-full hover:shadow-lg hover:shadow-primary/30 transition-all flex items-center" type="submit">
                        Next Step
                        <span class="material-icons ml-2">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Decorative Bottom Image -->
<div class="h-12 w-full bg-primary/5 flex items-center justify-center overflow-hidden">
<div class="flex space-x-4 opacity-30">
<span class="material-icons text-primary">spa</span>
<span class="material-icons text-primary">restaurant</span>
<span class="material-icons text-primary">monitor_heart</span>
<span class="material-icons text-primary">fitness_center</span>
<span class="material-icons text-primary">self_improvement</span>
</div>
</div>
</div>
</body></html>
